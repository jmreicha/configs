### Prompt

# The format layout for the prompt is as follows:

# left side
# fill (expands to fill the remaining space between left and right prompts)
# right side info
# right side additional tools and versions
# prompt character

# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000

format = """$sudo$username$hostname$directory$git_branch$git_commit$git_state$git_metrics$git_status\
$fill\
$jobs$status$cmd_duration\
$nix_shell$terraform${custom.terraform}${custom.opentofu}${custom.terragrunt}$kubernetes$helm$python$nodejs$golang$aws$gcloud$docker_context${custom.loadavg-linux}${custom.loadavg-mac}${custom.disk-linux}${custom.disk-mac}$memory_usage$time$os
$character"""

# TODO: transient prompt released in v1.10.1

# Additional padding between newlines
add_newline = true

[character]
vimcmd_symbol = "[NORMAL ❯](#73cef4)"
success_symbol = "[❯](green)"
format = "\n$symbol "

[fill]
symbol = " "

### Left prompt

[directory]
read_only = " "
truncation_length = 2
truncate_to_repo = false
repo_root_style = "#0087af"
fish_style_pwd_dir_length = 2
style = "#00afff"
# Repo format
repo_root_format = "[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
# Non repo format
format = "[ $path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "green"
format = "[❯ ](#767676)[$symbol$branch]($style)"

[git_commit]
tag_disabled = false
format = "[ \\($hash$tag\\)]($style)"

[git_metrics]
disabled = false
format = "( [+$added]($added_style))([ -$deleted]($deleted_style))"

[git_status]
stashed = "[*${count}](blue) "
modified = "[!${count}](yellow) "
staged = "[~${count}](cyan) "
untracked = "[?${count}](blue) "
deleted = "[-${count}](red) "
format = " ([$stashed$modified$staged$untracked$ahead_behind]($style))"
#format = " ([$all_status $ahead_behind]($style))"

[hostname]
disabled = true
ssh_only = true
style = "#d3b987"
format = "[@$hostname]($style)[ ❯](#767676)"

[sudo]
disabled = false
symbol = "🧙"
format = "[$symbol]($style)"

[username]
# Don't display for normal logged in user
disabled = true
style_user = "#d3b987"
format = "[$user]($style)"

### Right prompt info

[cmd_duration]
style = "#a8a8a8"
format = "([ ❮ ](#767676)[ $duration]($style))"

[jobs]
disabled = false
format = "[$number]($style)"

[status]
disabled = false
map_symbol = false
format = "[$symbol$status]($style)"

### Right prompt tools and versions

[aws]
disabled = false
symbol = " "
format = '([ ❮ ](#767676)[$symbol$profile(\[$duration\])]($style))'

[conda]
symbol = " "

[docker_context]
symbol = " "
format = "([ ❮ ](#767676)[$symbol$context]($style))"

[gcloud]
disabled = false
symbol = "󱇶 "
format = '([ ❮ ](#767676)[$symbol$project( \($region\))]($style))'

[golang]
symbol = " "
format = "([ ❮ ](#767676)[$symbol($version)]($style))"

[helm]
symbol = "⎈ "
format = "([ ❮ ](#767676)[$symbol($version)]($style))"

[kubernetes]
disabled = false
style = "blue"
format = '([ ❮ ](#767676)[$symbol$context (\[$namespace\])]($style))'
detect_extensions = []
detect_files = ['Chart.yaml']
detect_folders = ['*helm*']

[memory_usage]
disabled = false
threshold = -1
symbol = ""
style = "#5f8787"
format = "([ ❮ ](#767676)[󰍛 $ram_pct]($style))"

[nix_shell]
symbol = " "
format = "([ ❮ ](#767676)[${symbol}nix ${state}]($style))"

[nodejs]
symbol = " "
format = "([ ❮ ](#767676)[$symbol($version)]($style))"

[os]
disabled = false
format = "[ ❮ ](#767676)[$symbol]($style)"

[os.symbols]
"Alpine" = ""
"Arch" = ""
"CentOS" = ""
"Debian" = ""
"Fedora" = ""
"Gentoo" = ""
"Linux" = ""
"Macos" = ""
"Manjaro" = ""
"Mint" = ""
"NixOS" = ""
"Raspbian" = ""
"Ubuntu" = ""
"Windows" = ""

[python]
symbol = " "
format = '([ ❮ ](#767676)[${symbol}${pyenv_prefix}(${version}) ([\($virtualenv\)](#306998))]($style))'

[shlvl]
disabled = true

[terraform]
# We disable the native tf plugin because it is much slower than tenv
disabled = true
format = "[ ❮ ](#767676)[tf $version]($style)"
detect_extensions = ["tf"]
detect_files = ["terragrunt.hcl"]

[time]
disabled = true
format = "([ ❮ ](#767676)[$time]($style))"

### Custom modules

[custom.opentofu]
description = "Shows active OpenTofu version from tenv version files"
command = "cat .opentofu-version 2>/dev/null || cat \"$(git rev-parse --show-toplevel 2>/dev/null)/.opentofu-version\" 2>/dev/null"
extensions = ["tf"]
files = [".opentofu-version"]
style = "#ffda18"
format = "([ ❮ ](#767676)[tofu $output]($style))"

[custom.terraform]
description = "Shows active Terraform version from tenv version files"
command = "cat .terraform-version 2>/dev/null || cat \"$(git rev-parse --show-toplevel 2>/dev/null)/.terraform-version\" 2>/dev/null"
extensions = ["tf"]
files = [".terraform-version", "terragrunt.hcl"]
style = "#7b42bc"
format = "([ ❮ ](#767676)[tf $output]($style))"

[custom.terragrunt]
description = "Shows active Terragrunt version from tenv version files"
command = "cat .terragrunt-version 2>/dev/null || cat \"$(git rev-parse --show-toplevel 2>/dev/null)/.terragrunt-version\" 2>/dev/null"
files = ["terragrunt.hcl"]
style = "#0bb9f2"
format = "([ ❮ ](#767676)[tg $output]($style))"

[custom.disk-linux]
description = "Show disk used"
command = 'df -h --output=avail "$PWD" | tail -n 1'
style = "#00af5f"
format = "[ ❮ ](#767676)[ $output]($style)"
when = "true"
os = "linux"

[custom.disk-mac]
description = "Show % of disk used"
command = "df -k | grep -E '/dev/disk(1|3)s(3|4)' | awk '{ print $5 }' | head -n 1 | sed 's/%//'"
style = "#00af5f"
format = "[ ❮ ](#767676)[ $output%]($style)"
when = "true"
os = "macos"

[custom.loadavg-linux]
description = "Show load average"
command = "cat /proc/loadavg | cut -d' ' -f 2"
style = "#5f8787"
format = "([ ❮ ](#767676)[ $output]($style))"
when = "true"
os = "linux"

[custom.loadavg-mac]
description = "Show load average"
command = "sysctl -n vm.loadavg | cut -d' ' -f 2"
style = "#5f8787"
format = "([ ❮ ](#767676)[ $output]($style))"
when = "true"
os = "macos"
